<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Mocha direct-first architecture</title>
  <desc id="desc">A native iPhone app connects through a direct Tailscale HTTPS and WebSocket path to a local host bridge, which exposes provider adapters for tmux, Herdr, and future official structured protocols. Coding agent processes and credentials remain on the computer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111418"/>
      <stop offset="1" stop-color="#090b0d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c7ff4a"/>
    </marker>
  </defs>
  <rect width="1200" height="680" rx="36" fill="url(#bg)"/>
  <text x="64" y="74" fill="#f4f7f9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32" font-weight="700">Direct-first, host-owned architecture</text>
  <text x="64" y="108" fill="#9ea6ae" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">The phone is a control plane. Execution, files, sessions, and vendor credentials remain on the user’s computer.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="168" width="260" height="364" rx="32" fill="#171b20" stroke="#2b3239"/>
    <rect x="91" y="198" width="206" height="306" rx="28" fill="#0c0f12" stroke="#3b444d" stroke-width="2"/>
    <rect x="111" y="226" width="166" height="70" rx="18" fill="#1a2026"/>
    <circle cx="133" cy="249" r="7" fill="#ffbd2e"/>
    <text x="150" y="255" fill="#f4f7f9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700">Needs attention</text>
    <rect x="111" y="313" width="166" height="122" rx="18" fill="#11161b" stroke="#253039"/>
    <text x="128" y="344" fill="#c7ff4a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">$ codex</text>
    <text x="128" y="369" fill="#d2d8de" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">Approve test command?</text>
    <rect x="128" y="388" width="62" height="28" rx="14" fill="#c7ff4a"/>
    <text x="146" y="407" fill="#0b0d0f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" font-weight="700">Resume</text>
    <text x="194" y="470" text-anchor="middle" fill="#9ea6ae" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">SwiftUI + GhosttyKit / Metal</text>
    <text x="194" y="560" text-anchor="middle" fill="#f4f7f9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700">iPhone / iPad</text>
    <text x="194" y="586" text-anchor="middle" fill="#9ea6ae" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">Keychain • biometrics • demo mode</text>
  </g>

  <line x1="336" y1="350" x2="510" y2="350" stroke="#c7ff4a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="352" y="296" width="144" height="40" rx="20" fill="#192017" stroke="#5b742a"/>
  <text x="424" y="322" text-anchor="middle" fill="#dfff9a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="700">Direct preferred</text>
  <text x="424" y="378" text-anchor="middle" fill="#cbd2d8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">HTTPS + WebSocket</text>
  <text x="424" y="402" text-anchor="middle" fill="#9ea6ae" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">Tailscale / LAN</text>

  <g filter="url(#shadow)">
    <rect x="530" y="148" width="606" height="432" rx="32" fill="#15191e" stroke="#2b3239"/>
    <text x="566" y="190" fill="#f4f7f9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="700">User-owned Mac / computer</text>
    <text x="566" y="218" fill="#9ea6ae" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">Mocha host binds to localhost; Tailscale Serve terminates private HTTPS.</text>

    <rect x="566" y="252" width="534" height="76" rx="20" fill="#0f1317" stroke="#35404a"/>
    <text x="590" y="282" fill="#c7ff4a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700">Stable Mocha protocol</text>
    <text x="590" y="307" fill="#b7c0c8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">Pairing • hosts • sessions • terminal I/O • status • capabilities • reconnect</text>

    <rect x="566" y="354" width="164" height="138" rx="20" fill="#10161b" stroke="#2e5d75"/>
    <text x="590" y="388" fill="#63c7ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="700">tmux provider</text>
    <text x="590" y="416" fill="#bdc5cc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">Universal fallback</text>
    <text x="590" y="440" fill="#8e98a1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">PTY bytes</text>
    <text x="590" y="462" fill="#8e98a1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">Durable sessions</text>

    <rect x="751" y="354" width="164" height="138" rx="20" fill="#10161b" stroke="#6b5e2c"/>
    <text x="775" y="388" fill="#ffd45b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="700">Herdr provider</text>
    <text x="775" y="416" fill="#bdc5cc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">Attention-aware</text>
    <text x="775" y="440" fill="#8e98a1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">Workspaces + panes</text>
    <text x="775" y="462" fill="#8e98a1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">State + events</text>

    <rect x="936" y="354" width="164" height="138" rx="20" fill="#10161b" stroke="#5c3b75"/>
    <text x="960" y="388" fill="#c997ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="700">Rich adapters</text>
    <text x="960" y="416" fill="#bdc5cc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">Opt-in, later</text>
    <text x="960" y="440" fill="#8e98a1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">Official protocols</text>
    <text x="960" y="462" fill="#8e98a1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">Chat + approvals</text>

    <line x1="648" y1="505" x2="648" y2="536" stroke="#59636d" stroke-width="2"/>
    <line x1="833" y1="505" x2="833" y2="536" stroke="#59636d" stroke-width="2"/>
    <line x1="1018" y1="505" x2="1018" y2="536" stroke="#59636d" stroke-width="2"/>
    <line x1="648" y1="536" x2="1018" y2="536" stroke="#59636d" stroke-width="2"/>
    <text x="833" y="564" text-anchor="middle" fill="#f4f7f9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700">Codex • Claude Code • shell • any terminal agent</text>
  </g>

  <rect x="64" y="620" width="1072" height="1" fill="#2b3239"/>
  <circle cx="78" cy="647" r="5" fill="#c7ff4a"/>
  <text x="94" y="653" fill="#b9c2ca" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">No hosted runtime required</text>
  <circle cx="322" cy="647" r="5" fill="#c7ff4a"/>
  <text x="338" y="653" fill="#b9c2ca" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">No vendor credential extraction</text>
  <circle cx="614" cy="647" r="5" fill="#c7ff4a"/>
  <text x="630" y="653" fill="#b9c2ca" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">Terminal always remains available</text>
  <circle cx="920" cy="647" r="5" fill="#c7ff4a"/>
  <text x="936" y="653" fill="#b9c2ca" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">Android can reuse the protocol</text>
</svg>
