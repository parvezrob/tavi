<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Tavi evidence-gated roadmap</title>
  <desc id="desc">A roadmap from product proof through native terminal, attention layer, review tools, and optional provider adapters, with gates between phases.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12161b"/><stop offset="1" stop-color="#090b0d"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#66727c"/></marker>
  </defs>
  <rect width="1200" height="590" rx="36" fill="url(#bg)"/>
  <text x="64" y="72" fill="#f4f7f9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="31" font-weight="700">Evidence-gated product roadmap</text>
  <text x="64" y="105" fill="#9ea6ae" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Each phase earns the next. Feature breadth is intentionally delayed until speed, reconnect, and the intervention loop are proven on real phones.</text>

  <line x1="122" y1="287" x2="1082" y2="287" stroke="#3d4750" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <circle cx="150" cy="287" r="17" fill="#c7ff4a"/><text x="150" y="291" text-anchor="middle" fill="#0a0c0d" font-size="12" font-weight="800">0</text>
    <rect x="78" y="152" width="220" height="100" rx="20" fill="#192017" stroke="#587029"/>
    <text x="98" y="183" fill="#eaffbd" font-size="16" font-weight="800">Product proof</text>
    <text x="98" y="208" fill="#b7c68e" font-size="12">10 interviews • benchmark</text>
    <text x="98" y="228" fill="#b7c68e" font-size="12">one chosen mobile flow</text>
    <rect x="100" y="324" width="176" height="50" rx="16" fill="#11161a" stroke="#303941"/>
    <text x="188" y="345" text-anchor="middle" fill="#dfe5e9" font-size="11" font-weight="700">GATE</text><text x="188" y="362" text-anchor="middle" fill="#8e98a1" font-size="10">users want intervention, not IDE</text>

    <circle cx="378" cy="287" r="17" fill="#63c7ff"/><text x="378" y="291" text-anchor="middle" fill="#071015" font-size="12" font-weight="800">1</text>
    <rect x="312" y="322" width="214" height="108" rx="20" fill="#10191f" stroke="#2e5d75"/>
    <text x="332" y="354" fill="#bde9ff" font-size="16" font-weight="800">Native terminal core</text>
    <text x="332" y="379" fill="#9ec5d8" font-size="12">SwiftUI shell • SwiftTerm spike</text>
    <text x="332" y="399" fill="#9ec5d8" font-size="12">Tailscale direct • tmux</text>
    <rect x="328" y="178" width="182" height="50" rx="16" fill="#11161a" stroke="#303941"/>
    <text x="419" y="199" text-anchor="middle" fill="#dfe5e9" font-size="11" font-weight="700">GATE</text><text x="419" y="216" text-anchor="middle" fill="#8e98a1" font-size="10">fast on physical iPhone</text>

    <circle cx="606" cy="287" r="17" fill="#ffd45b"/><text x="606" y="291" text-anchor="middle" fill="#161003" font-size="12" font-weight="800">2</text>
    <rect x="540" y="152" width="214" height="100" rx="20" fill="#1d1a10" stroke="#6b5e2c"/>
    <text x="560" y="183" fill="#ffecae" font-size="16" font-weight="800">Attention layer</text>
    <text x="560" y="208" fill="#d3c38d" font-size="12">Herdr state • exact resume</text>
    <text x="560" y="228" fill="#d3c38d" font-size="12">blocked/done/active queue</text>
    <rect x="556" y="324" width="182" height="50" rx="16" fill="#11161a" stroke="#303941"/>
    <text x="647" y="345" text-anchor="middle" fill="#dfe5e9" font-size="11" font-weight="700">GATE</text><text x="647" y="362" text-anchor="middle" fill="#8e98a1" font-size="10">20 useful interventions</text>

    <circle cx="834" cy="287" r="17" fill="#ff8f72"/><text x="834" y="291" text-anchor="middle" fill="#160a06" font-size="12" font-weight="800">3</text>
    <rect x="768" y="322" width="214" height="108" rx="20" fill="#201511" stroke="#704332"/>
    <text x="788" y="354" fill="#ffd2c5" font-size="16" font-weight="800">Review + context</text>
    <text x="788" y="379" fill="#d3aaa0" font-size="12">diff • files • images • preview</text>
    <text x="788" y="399" fill="#d3aaa0" font-size="12">voice • notifications</text>
    <rect x="784" y="178" width="182" height="50" rx="16" fill="#11161a" stroke="#303941"/>
    <text x="875" y="199" text-anchor="middle" fill="#dfe5e9" font-size="11" font-weight="700">GATE</text><text x="875" y="216" text-anchor="middle" fill="#8e98a1" font-size="10">review actions beat laptop fallback</text>

    <circle cx="1062" cy="287" r="17" fill="#c997ff"/><text x="1062" y="291" text-anchor="middle" fill="#100716" font-size="12" font-weight="800">4</text>
    <rect x="996" y="152" width="156" height="100" rx="20" fill="#1a1220" stroke="#5c3b75"/>
    <text x="1016" y="183" fill="#ead0ff" font-size="16" font-weight="800">Rich adapters</text>
    <text x="1016" y="208" fill="#c5a7d8" font-size="12">Codex app-server</text>
    <text x="1016" y="228" fill="#c5a7d8" font-size="12">chat mode, opt-in</text>
  </g>

  <rect x="64" y="478" width="1072" height="64" rx="18" fill="#101419" stroke="#293139"/>
  <text x="88" y="505" fill="#c7ff4a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="800">ALWAYS TRUE</text>
  <text x="88" y="527" fill="#b8c1c8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">Host-owned execution • terminal fallback • no mandatory relay • no extracted vendor credentials • Android inherits the stable protocol later</text>
</svg>
